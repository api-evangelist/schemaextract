name: SchemaExtract
description: >-
  A document-to-JSON extraction service. Upload a PDF or image, pick a preset or paste a JSON schema, and get typed
  fields back — vendor, totals, line items, packages, containers. Supports invoice, packing list, bank statement, and
  bill of lading presets plus custom schemas.
