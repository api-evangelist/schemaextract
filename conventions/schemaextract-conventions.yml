rate_limit_signaling:
  headers: [X-RateLimit-*]
  retry_after: unknown
  exhaustion_status: 429
  quota_exhaustion_status: 402
  note: Burst 60 req / 10 min per client -> 429 RATE_LIMITED with X-RateLimit-* headers. Monthly quota -> 402 QUOTA_EXCEEDED.
idempotency:
  coverage: none
  mechanism: none
  note: >-
    No Idempotency-Key header or replay-protection mechanism documented. The primary write
    (POST /v1/extract) is non-persistent — uploaded bytes are processed in memory and discarded
    after the response — so a repeated call re-extracts rather than duplicating stored state.
reversibility:
  grade: documented
  note: >-
    The core extraction surface is effectively stateless: files are held in memory only and dropped
    after the response/job, so an extract has nothing to undo. The only durable write surface is API
    key management, which is reversible.
  surfaces:
    - operation: 'DELETE /v1/keys/:id'
      reversal: revoke/delete API key
      operationId: null
      window: null
      note: Documented in the docs "Other endpoints" list; not present in the published OpenAPI.
    - operation: 'POST /v1/extract'
      reversal: na
      note: Non-persistent; input bytes discarded after the response, nothing to reverse.
dry_run_mode:
  supported: na
  note: Demo/mock mode returns extraction results without billing but is not a no-op rehearsal of a write.
