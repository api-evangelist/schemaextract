openapi: 3.2.0
info:
  title: SchemaExtract Health API
  version: 0.2.0
  description: Schema-driven document to JSON extraction. Upload a PDF or image plus a JSON schema (or preset) and receive structured data. Files are processed in memory and discarded after the response.
servers:
- url: /
  description: This deployment
security:
- bearerAuth: []
- {}
tags:
- name: Health
paths:
  /health:
    get:
      operationId: health
      summary: Liveness and feature flags
      security: []
      responses:
        '200':
          description: Service is up
      tags:
      - Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_live_
